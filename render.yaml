services:
  - type: web
    name: career-coach-three-versions
    runtime: docker
    plan: free
    branch: feature/v2-auth-deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: V2_DAILY_LIMIT
        value: "5"
      - key: SITE_DAILY_LIMIT
        value: "20"
