services:
  - type: web
    name: career-coach-v4-preview
    runtime: docker
    plan: free
    branch: codex/v4-career-explorer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ACCOUNT_DAILY_LIMIT
        value: "10"
